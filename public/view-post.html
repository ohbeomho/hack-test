<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hacking Test - View Post</title>
        <link rel="stylesheet" href="main.css" />
        <style>
            .content {
                white-space: pre-wrap;
                word-wrap: break-word;
                width: 100%;
                background-color: rgb(240, 240, 240);
                padding: 0.2rem;
            }

            .author,
            .created-at {
                font-size: 0.8rem;
                color: gray;
            }

            .info {
                width: 100%;
                display: flex;
                justify-content: space-between;
            }
        </style>
    </head>
    <body>
        <main>
            <h1 class="title">Loading...</h1>
            <p class="info">
                <span class="author"></span>
                <span class="created-at"></span>
            </p>
            <p class="content"></p>
            <a href="/">Back to Home</a>
        </main>

        <!-- TODO: make content's javascript in script tag executable. currently, it's not -->
        <script>
            const params = new URLSearchParams(window.location.search)
            const id = params.get("id")
            fetch(`/post/${id}`)
                .then((response) => response.json())
                .then((post) => {
                    document.querySelector("h1.title").innerText = post.title
                    document.querySelector("p.content").innerHTML = post.content
                    document.querySelector("span.author").innerText =
                        post.author
                    document.querySelector("span.created-at").innerText =
                        post.created_at
                })
        </script>
    </body>
</html>
