<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hacking Test</title>
        <link rel="stylesheet" href="main.css" />
        <style>
            .not-signed-in {
                display: none;
            }

            .signed-in {
                display: none;
            }

            .not-signed-in,
            .signed-in {
                justify-content: center;
                align-items: center;
                gap: 0.5rem;
            }

            ul {
                width: 100%;
                list-style: none;
                padding: 0;
                background-color: lightgray;
            }

            li {
                margin-bottom: 0.5rem;
                padding: 0.5rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        </style>
    </head>

    <body>
        <nav>
            <div class="not-signed-in">
                <a href="/signin.html">Sign In</a>
                <a href="/signup.html">Sign Up</a>
            </div>
            <div class="signed-in">
                <a href="/signout">Sign Out</a>
                <a href="/post.html">Create Post</a>
            </div>
        </nav>
        <main>
            <h1>Hacking Test</h1>
            <p>User: <span id="username"></span></p>
            <ul></ul>
        </main>

        <script>
            function getCookie(name) {
                for (let cookie of document.cookie.split(";")) {
                    cookie = cookie.trim()
                    if (cookie.startsWith(name + "="))
                        return cookie.split("=")[1]
                }
            }

            const username = getCookie("username"),
                usernameDisplay = document.getElementById("username")
            if (username) {
                usernameDisplay.innerText = username
                document.querySelector(".signed-in").style.display = "flex"
            } else {
                usernameDisplay.innerText = "<Not signed in>"
                document.querySelector(".not-signed-in").style.display = "flex"
            }

            const posts = document.querySelector("ul")
            fetch("/posts")
                .then((response) => response.json())
                .then((data) => {
                    data.forEach((post) => {
                        const li = document.createElement("li")
                        li.innerHTML = `<a href="/view-post.html?id=${post.id}" class="title">${post.title}</a><span class="author">${post.author}</span>`
                        posts.appendChild(li)
                    })
                })
        </script>
    </body>
</html>
